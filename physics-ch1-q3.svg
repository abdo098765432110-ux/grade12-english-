  <circle cx="200" cy="190" r="120" stroke="#2b3654" stroke-width="4" fill="none"/>
  <path d="M80 196l-9 -14h18z" fill="#2b3654"/>
  <path d="M206 310l-14 -9v18z" fill="#2b3654"/>
  <circle cx="200" cy="70" r="20" fill="#ffffff" stroke="#2b3654" stroke-width="4"/>
  <path d="M190 70h20M200 60v20" stroke="#2b3654" stroke-width="3.5" stroke-linecap="round"/>
  <text x="200" y="40" text-anchor="middle" font-size="24" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#2b3654">4μC</text>
  <circle cx="200" cy="190" r="7" fill="#2b3654"/>
  <path d="M210 190H312" stroke="#2b3654" stroke-width="3.5" stroke-dasharray="14 10"/>
