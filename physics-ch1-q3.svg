  <text x="260" y="220" text-anchor="middle" font-size="24" font-style="italic" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#2b3654">r</text>
  <text x="20" y="356" font-size="26" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#2b3654">f=2000Hz</text>
</svg>
