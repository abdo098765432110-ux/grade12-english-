<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 370" width="400" height="370">
  <!-- Physics, chapter 1, question 3: a charge of 4μC moves round a circle of radius r with a frequency of 2000Hz, passing the point X. -->
