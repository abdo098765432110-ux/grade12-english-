<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" width="560" height="480" role="img" aria-label="">
  <!-- Home page illustration: a secondary-school student seen from behind
       (upper body, face not visible) studying at a desk with a laptop, books
       and a lamp. Original drawing for this website, in the site's colours. -->
  <style>
    .badge { transform-box: fill-box; transform-origin: 50% 50%; animation: pop 0.7s cubic-bezier(0.2, 0.9, 0.3, 1.25) 0.4s both; }
    @keyframes pop { from { opacity: 0; transform: scale(0.6); } to { opacity: 1; transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { .badge { animation: none; } }
  </style>

  <!-- soft shapes behind -->
  <circle cx="306" cy="238" r="200" fill="#dcebff"/>
  <circle cx="500" cy="74" r="34" fill="#ffe48a"/>
  <circle cx="74" cy="118" r="22" fill="#e5dcff"/>
  <path d="M536 214l5 12 12 5-12 5-5 12-5-12-12-5 12-5z" fill="#ffd35a"/>
  <path d="M40 250l4 9 9 4-9 4-4 9-4-9-9-4 9-4z" fill="#b9a6ff"/>

  <!-- wall shelf with books -->
  <rect x="92" y="150" width="128" height="8" rx="4" fill="#a9cbff"/>
  <rect x="104" y="104" width="16" height="46" rx="3" fill="#9b84f5"/>
  <rect x="122" y="112" width="14" height="38" rx="3" fill="#3ccb91"/>
  <rect x="138" y="100" width="18" height="50" rx="3" fill="#5b9cf0"/>
  <rect x="160" y="118" width="38" height="12" rx="3" fill="#ffc447" transform="rotate(-18 179 124)"/>

  <!-- desk -->
  <path d="M40 318h480a14 14 0 0 1 14 14v148H26V332a14 14 0 0 1 14-14z" fill="#e8e0ff"/>
  <path d="M26 334h508v14H26z" fill="#d6c9ff"/>
  <path d="M58 300h444l32 34H26z" fill="#ffffff"/>

  <!-- desk lamp, shining on the books -->
  <path d="M132 256l40-8 34 52h-88z" fill="#fff0b3" opacity="0.85"/>
  <ellipse cx="72" cy="306" rx="28" ry="7" fill="#9b84f5"/>
  <path d="M72 304l18-80" stroke="#9b84f5" stroke-width="7" stroke-linecap="round"/>
  <path d="M90 224l36 18" stroke="#9b84f5" stroke-width="7" stroke-linecap="round"/>
  <circle cx="90" cy="224" r="7" fill="#7c62e8"/>
  <path d="M116 226c22-10 50 0 56 22l-44 8c-8-8-12-18-12-30z" fill="#ffc447"/>

  <!-- books on the desk -->
  <rect x="112" y="286" width="88" height="14" rx="4" fill="#3ccb91"/>
  <rect x="118" y="273" width="78" height="13" rx="4" fill="#5b9cf0"/>
  <rect x="186" y="289" width="10" height="8" rx="2" fill="#ffffff" opacity="0.8"/>

  <!-- laptop showing a lesson -->
  <path d="M286 300h214l14 12H272z" fill="#a9cbff"/>
  <rect x="296" y="132" width="196" height="166" rx="12" fill="#2b3654"/>
  <rect x="306" y="142" width="176" height="146" rx="6" fill="#f6f9ff"/>
  <rect x="306" y="142" width="176" height="20" rx="6" fill="#dcebff"/>
  <circle cx="318" cy="152" r="3" fill="#ff9aa2"/>
  <circle cx="328" cy="152" r="3" fill="#ffd25c"/>
  <circle cx="338" cy="152" r="3" fill="#3ccb91"/>
  <rect x="318" y="174" width="96" height="9" rx="4.5" fill="#2f63b0"/>
  <rect x="318" y="191" width="150" height="6" rx="3" fill="#c7d6ee"/>
  <rect x="318" y="203" width="132" height="6" rx="3" fill="#c7d6ee"/>
  <rect x="318" y="219" width="150" height="30" rx="7" fill="#d3f4e4"/>
  <circle cx="333" cy="234" r="7" fill="#3ccb91"/>
  <path d="M329.5 234l2.5 2.5 4.5-5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="346" y="230" width="104" height="6" rx="3" fill="#8fd9b6"/>
  <rect x="318" y="262" width="150" height="8" rx="4" fill="#e8e0ff"/>
  <rect x="318" y="262" width="102" height="8" rx="4" fill="#9b84f5"/>

  <!-- plant -->
  <path d="M502 300h36l-5-28h-26z" fill="#ffc447"/>
  <path d="M520 272c-12-16-16-30-9-42 11 9 13 25 9 42z" fill="#3ccb91"/>
  <path d="M520 272c4-20 14-30 27-32 0 16-12 27-27 32z" fill="#1f9e6a"/>
  <path d="M520 272c-10-5-21-3-28 5 10 7 19 5 28-5z" fill="#8fd9b6"/>

  <!-- student, seen from behind (face not visible): hoodie, neck, back of the head -->
  <path d="M208 294h44v52c0 9-10 16-22 16s-22-7-22-16z" fill="#c98e68"/>
  <path d="M56 480c4-76 64-124 174-132 110 8 170 56 174 132z" fill="#5b9cf0"/>
  <path d="M116 398q26-28 58-38M344 398q-26-28-58-38" stroke="#4a86de" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M174 354q56-28 112 0-12 42-56 46-44-4-56-46z" fill="#4a86de"/>
  <path d="M194 360q36-16 72 0" stroke="#3f78cc" stroke-width="4" stroke-linecap="round" fill="none"/>
  <ellipse cx="186" cy="266" rx="8" ry="13" fill="#d99a72"/>
  <ellipse cx="274" cy="266" rx="8" ry="13" fill="#d99a72"/>
  <ellipse cx="230" cy="260" rx="46" ry="55" fill="#d99a72"/>
  <!-- short, faded haircut -->
  <path d="M185 258c-4-48 16-78 45-78s49 30 45 78c-3 14-10 25-19 31-17 6-35 6-52 0-9-6-16-17-19-31z" fill="#6b5446"/>
  <path d="M184 252c-3-46 18-74 46-74s49 28 46 74c-4 10-9 18-15 24-20 6-42 6-62 0-6-6-11-14-15-24z" fill="#2f241f"/>
  <path d="M204 206c10-10 22-14 34-12" stroke="#4a3a31" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- an "A+" grade badge -->
  <g class="badge">
    <circle cx="470" cy="118" r="30" fill="#ffffff" stroke="#ffd25c" stroke-width="5"/>
    <text x="470" y="129" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="28" fill="#744b00">A+</text>
  </g>
</svg>
